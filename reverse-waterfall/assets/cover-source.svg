<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="2560" viewBox="0 0 1600 2560">
  <title>Reverse Waterfall — cover source</title>
  <desc>Dark navy literary cover with three streams of water rising upward and small droplets above them.</desc>

  <defs>
    <radialGradient id="glow" cx="68%" cy="28%" r="46%">
      <stop offset="0%" stop-color="#55cabb" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#55cabb" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#55cabb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081322"/>
      <stop offset="100%" stop-color="#0c2233"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2560" fill="url(#background)"/>
  <rect width="1600" height="2560" fill="url(#glow)"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="96" y="180" font-size="34" fill="#9ab0be" letter-spacing="4">A POEM</text>

    <text x="92" y="305" font-size="142" font-weight="300" fill="#f2f6f7" letter-spacing="2">REVERSE</text>
    <text x="92" y="402" font-size="142" font-weight="300" fill="#f2f6f7" letter-spacing="2">WATERFALL</text>

    <rect x="96" y="432" width="160" height="6" rx="3" fill="#70ddcf"/>

    <text x="96" y="2320" font-size="52" fill="#c5d6dd" letter-spacing="2">YAKSHAWAN</text>
    <text x="96" y="2390" font-size="30" fill="#5f8192" letter-spacing="3">EPUB PREFLIGHT SAMPLE</text>
  </g>

  <g fill="none" stroke-linecap="butt">
    <path d="M 1040 2260 C 1095 1875 1010 1500 1050 1110"
          stroke="#e5f4f2" stroke-width="22" opacity="0.88"/>
    <path d="M 1160 2260 C 1240 1870 1120 1400 1190 840"
          stroke="#70ddcf" stroke-width="62"/>
    <path d="M 1300 2290 C 1370 1840 1230 1360 1270 760"
          stroke="#5cb8d3" stroke-width="38" opacity="0.94"/>
  </g>

  <g fill="#96e6dc">
    <circle cx="1185" cy="690" r="17" opacity="0.95"/>
    <circle cx="1250" cy="610" r="10" opacity="0.72"/>
    <circle cx="1090" cy="815" r="12" opacity="0.68"/>
    <circle cx="1330" cy="770" r="8" opacity="0.62"/>
    <circle cx="1140" cy="570" r="6" opacity="0.5"/>
  </g>
</svg>
